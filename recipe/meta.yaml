{% set xorg_name = "xproto" %}
{% set xorg_category = "proto" %}
{% set name = "xorg-" ~ xorg_name %}
{% set version = "7.0.31" %}
{% set sha256 = "c6f9747da0bd3a95f86b17fb8dd5e717c8f3ab7f0ece3ba1b247899ec1ef7747" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.bz2
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.bz2
  sha256: {{ sha256 }}
  patches:
    - windows-fd_bits.patch  # [win]
    - windows-64bit.patch  # [win]

build:
  number: 1009
  detect_binary_files_with_prefix: true

requirements:
  build:
    - m2-autoconf                   # [win and x86_64]
    - m2-automake{{ am_version }}   # [win and x86_64]
    - m2-libtool                    # [win and x86_64]
    - pkg-config                    # [unix or (win and arm64)]
    - m2-pkg-config                 # [win and x86_64]
    - gnuconfig                     # [unix]
    - m2-base                       # [win and x86_64]
    - make                          # [unix]
    - m2-make                       # [win and x86_64]
    - {{ compiler('c') }}           # [unix or (win and arm64)]
    - {{ stdlib("c") }}             # [unix or (win and arm64)]
    - {{ compiler('m2w64_c') }}     # [win and x86_64]
    - {{ stdlib("m2w64_c") }}       # [win and x86_64]
    - autotools_clang_conda         # [win and arm64]
    - autoconf                      # [unix]
    - automake                      # [unix]
    - gettext                       # [unix]
    - libtool                       # [unix]
  host:
    - xorg-util-macros

test:
  commands:

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: 'Core X Windows C prototypes.'

extra:
  recipe-maintainers:
    - pkgw
